version: '3.8'

networks:
  app-net:
    name: npm_app-net
    external: true

services:
  shortlink-app:
    build: .
    container_name: shortlink-app
    restart: unless-stopped
    environment:
      - ADMIN_PASS=${ADMIN_PASS:-changeme}
    volumes:
      - shortlink_data:/app/data
    networks:
      - app-net

volumes:
  shortlink_data:
